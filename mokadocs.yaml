site:
  title: "Moka.Blazor.AI"
  description: "A reusable Blazor AI chat panel component with streaming, theming, and pluggable providers"
  logo: icon.png
  favicon: icon.png

content:
  docs: ./docs
  projects:
    - path: ./src/Moka.AI/Moka.AI.csproj
      label: Core Library
    - path: ./src/Moka.Blazor.AI/Moka.Blazor.AI.csproj
      label: Blazor Components
    - path: ./src/Moka.AI.Onnx/Moka.AI.Onnx.csproj
      label: ONNX Provider
    - path: ./src/Moka.AI.Mcp/Moka.AI.Mcp.csproj
      label: MCP Client
    - path: ./src/Moka.AI.McpServer/Moka.AI.McpServer.csproj
      label: MCP Server Host

nav:
  - label: "Guide"
    icon: book-open
    expanded: true
    children:
      - label: "Getting Started"
        path: "/guide/getting-started"
      - label: "Configuration"
        path: "/guide/configuration"
      - label: "Theming"
        path: "/guide/theming"
      - label: "MCP & Tool Calling"
        path: "/guide/mcp"
      - label: "Hosting an MCP Server"
        path: "/guide/mcp-server"
      - label: "Extending"
        path: "/guide/extending"

theme:
  name: default
  options:
    primaryColor: "#0ea5e9"
    codeTheme: catppuccin-mocha
    codeStyle: macos
    showEditLink: false
    showLastUpdated: true
    socialLinks:
      - icon: github
        url: "https://github.com/jacobwi/Moka.Blazor.AI"
      - icon: nuget
        url: "https://www.nuget.org/packages/Moka.Blazor.AI"

plugins:
  - name: mokadocs-repl
